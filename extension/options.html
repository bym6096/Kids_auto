<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>YouTube Kids 자동 로그인 설정</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=text], input[type=password], input[type=email], select { width: 100%; padding: 8px; box-sizing: border-box; font-size: 15px; }
  .hint { color: #666; font-size: 13px; margin-top: 2px; }
  .warn { background: #fff4e5; border-left: 4px solid #f0a000; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; }
  button { padding: 8px 16px; font-size: 15px; cursor: pointer; }
  pre { background: #f6f6f6; padding: 10px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  #status { margin-left: 12px; color: #0a7a2f; }
</style>
</head>
<body>
<h1>YouTube Kids 자동 로그인</h1>

<div class="row"><input type="checkbox" id="enabled"><label for="enabled" style="margin:0">자동 로그인 사용</label></div>

<label for="mode">로그인 방식</label>
<select id="mode">
  <option value="supervised">감독 대상 Google 계정으로 로그인 (생년 입력 없음)</option>
  <option value="parent">보호자 계정으로 시작 (다음 → 생년 입력)</option>
</select>
<div class="hint">로그아웃 후 보이는 화면에서 평소 어떤 경로로 들어가는지에 맞춰 고르세요.</div>

<label for="birthYear">생년 4자리 (선택)</label>
<input type="text" id="birthYear" inputmode="numeric" maxlength="4" placeholder="예: 1985">
<div class="hint">'보호자 계정' 방식에서 나오는 연령 확인 화면용입니다. 비워 두면 그 화면에서 멈추고 직접 입력을 기다립니다.</div>

<label for="profile">시청할 프로필 이름 (선택)</label>
<input type="text" id="profile" placeholder="예: 민준">
<div class="hint">프로필 선택 화면이 나올 때 이 이름의 프로필을 자동으로 누릅니다.</div>

<p><button id="save">저장</button><span id="status"></span></p>

<h2>동작 기록</h2>
<p class="hint">자동 로그인이 어디서 멈췄는지 확인할 수 있습니다. 문제가 있으면 이 내용을 복사해서 알려주세요.</p>
<p>
  <button id="refresh">새로고침</button>
  <button id="clear">기록·재시도 제한 초기화</button>
</p>
<pre id="log">(기록 없음)</pre>
<script src="options.js"></script>
</body>
</html>
